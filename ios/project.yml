name: DormLock
options:
  bundleIdPrefix: com.dorm
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

targets:
  DormLock:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dorm.lock
        PRODUCT_NAME: DormLock
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 门锁
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSBluetoothAlwaysUsageDescription: 需要蓝牙权限连接宿舍门锁并开锁
        NSBluetoothPeripheralUsageDescription: 需要蓝牙权限连接宿舍门锁并开锁
    scheme:
      testTargets: []
      gatherCoverageData: false
