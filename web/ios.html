<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="manifest-ios.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="门锁">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>宿舍门锁</title>
<script src="crypto-js.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: #0b0b0d; color: #eee;
    font-family: -apple-system, "PingFang SC", sans-serif;
    padding: 24px calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  h1 { font-size: 17px; font-weight: 400; color: #888; margin: 0; letter-spacing: .28em; }
  #st { font-size: 13px; color: #8a8a96; min-height: 18px; }
  #st.ok { color: #5fd97f; } #st.err { color: #ff6b6b; } #st.wait { color: #ffd166; }
  #btn {
    width: 196px; height: 196px; border-radius: 50%; border: none;
    background: radial-gradient(circle at 35% 30%, #3a3a44, #1a1a20);
    color: #fff; font-size: 26px; font-weight: 600; letter-spacing: .18em;
    box-shadow: 0 12px 44px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12);
    transition: transform .12s, background .25s;
    cursor: pointer; -webkit-user-select: none; user-select: none;
  }
  #btn:active { transform: scale(.94); }
  #btn.ok { background: radial-gradient(circle at 35% 30%, #1f7a45, #0d4526); }
  #btn.err { background: radial-gradient(circle at 35% 30%, #8a2c2c, #4a1414); }
  #btn:disabled { opacity: .55; }
  #log {
    width: 100%; max-width: 460px; height: 236px; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: #15151a; border-radius: 12px; padding: 12px;
    font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    line-height: 1.6; color: #8a8a96; white-space: pre-wrap; word-break: break-all;
  }
  .cfg { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 8px; }
  .cfg input {
    background: #15151a; border: 1px solid #26262e; color: #ccc;
    border-radius: 8px; padding: 10px 12px; font-size: 12px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .row { display: flex; gap: 8px; }
  .row button {
    flex: 1; background: #26262e; border: none; color: #aaa; border-radius: 8px;
    padding: 11px 0; font-size: 13px;
  }
  .row button:active { background: #33333d; }
</style>
</head>
<body>

<h1>宿 舍 门 锁</h1>
<div id="st">准备</div>
<button id="btn">开锁</button>

<div id="log"></div>

<div class="cfg">
  <input id="key" placeholder="activationKey（32 位 hex）" autocapitalize="none" autocorrect="off" spellcheck="false">
  <input id="name" placeholder="设备名关键字（默认 TmallLock）" autocapitalize="none" autocorrect="off" spellcheck="false">
  <div class="row">
    <button id="save">保存</button>
    <button id="forget">忘掉设备</button>
  </div>
</div>

<script>
/* ============================================================
   VOC 蓝牙门锁 · iOS / Bluefy 版
   协议基于某款宿舍门锁 App 的客户端行为分析

   iOS 与 Android 的两条硬性差异：
   1) Safari 不支持 Web Bluetooth，必须用 Bluefy 浏览器
   2) requestDevice() 必须在用户点击的同步调用栈里发起，
      中间不能有 await，否则秒抛 NotAllowedError
   ============================================================ */

const SERVICE_UUID  = "00002760-08c2-11e1-9073-0e8ac72e1001";
const RANDOM_REQ    = "55AAFF0D00000B";
const LINK_ESTAB    = "55AAFF13000011";
const UNLOCK_PLAIN  = "FF0B0000090000000000000000000000";
const RX_QUIET      = 180;   // iOS 的 BLE 回调比安卓慢，静默阈值放宽到 180ms
const CHUNK         = 20;

const $ = id => document.getElementById(id);
const logEl = $("log"), stEl = $("st"), btn = $("btn");
const sleep = ms => new Promise(r => setTimeout(r, ms));

function log(msg) {
  const t = new Date().toTimeString().slice(0, 8);
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
  console.log("[DoorLock]", msg);
}

function setStatus(s, cls) {
  stEl.textContent = s;
  stEl.className = cls || "";
}

/* ---------------- 算法 ---------------- */
const hexToBytes = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
const bytesToHex = b => [...b].map(x => x.toString(16).padStart(2, "0")).join("");
const checksum = h => (h.match(/../g).reduce((s, x) => s + parseInt(x, 16), 0) & 0xFF)
                      .toString(16).padStart(2, "0");

function xorHex(a, b) {
  const A = hexToBytes(a), B = hexToBytes(b);
  return bytesToHex(A.map((v, i) => v ^ B[i % B.length]));
}

function aesEnc(keyHex, plainHex) {
  return CryptoJS.AES.encrypt(
    CryptoJS.enc.Hex.parse(plainHex),
    CryptoJS.enc.Hex.parse(keyHex),
    { mode: CryptoJS.mode.ECB, padding: CryptoJS.pad.NoPadding }
  ).ciphertext.toString(CryptoJS.enc.Hex);
}

function aesDec(keyHex, ctHex) {
  return CryptoJS.AES.decrypt(
    { ciphertext: CryptoJS.enc.Hex.parse(ctHex) },
    CryptoJS.enc.Hex.parse(keyHex),
    { mode: CryptoJS.mode.ECB, padding: CryptoJS.pad.NoPadding }
  ).toString(CryptoJS.enc.Hex);
}

/* 在收到的 hex 流里定位 55aa0010 帧，取后 16 字节密文。
   分包可能把上一帧尾字节混进来，绝不能写死 substring(8,40) */
function pickCipher(h) {
  const s = h.toLowerCase();
  let i = s.indexOf("55aa0010");
  while (i >= 0) {
    if (i + 40 <= s.length) return s.substr(i + 8, 32);
    i = s.indexOf("55aa0010", i + 2);
  }
  return null;
}

/* ---------------- 配置 ---------------- */
$("key").value  = localStorage.getItem("voc_key")  || "";
$("name").value = localStorage.getItem("voc_name") || "TmallLock";

$("save").onclick = () => {
  localStorage.setItem("voc_key", $("key").value.trim().toLowerCase());
  localStorage.setItem("voc_name", $("name").value.trim());
  log("配置已保存");
};

$("forget").onclick = () => {
  localStorage.removeItem("voc_dev_id");
  log("已忘掉设备，下次要重新选");
};

const getKey  = () => $("key").value.trim().toLowerCase();
const getName = () => ($("name").value.trim() || "TmallLock");

/* ---------------- 蓝牙 ---------------- */
let device = null;
let server = null;
let srv = null;
let writeCh = null, notifyCh = null;

/* 只在这个函数里调 requestDevice —— 必须是点击的同步第一跳，前面不能有 await */
function pickDeviceSync() {
  return navigator.bluetooth.requestDevice({
    acceptAllDevices: true,
    optionalServices: [SERVICE_UUID]
  });
}

async function cachedDevice() {
  const want = localStorage.getItem("voc_dev_id");
  if (!want || !navigator.bluetooth.getDevices) return null;
  try {
    const all = await navigator.bluetooth.getDevices();
    return all.find(d => d.id === want) || null;
  } catch (e) { return null; }
}

async function openServer(dev) {
  let lastErr = null;
  for (let i = 0; i < 3; i++) {
    try {
      server = await dev.gatt.connect();
      srv = await server.getPrimaryService(SERVICE_UUID);
      return srv;
    } catch (e) {
      lastErr = e;
      log(`连接尝试 ${i + 1}/3 失败：${e.message || e}`);
      try { dev.gatt.disconnect(); } catch (_) {}
      await sleep(400);
    }
  }
  throw lastErr || new Error("连接失败");
}

async function bindChannels(service) {
  const chars = await service.getCharacteristics();
  writeCh = notifyCh = null;
  for (const c of chars) {
    const p = c.properties;
    if (p.write || p.writeWithoutResponse) writeCh = c;
    if (p.notify || p.indicate) notifyCh = c;
  }
  if (!writeCh || !notifyCh) throw new Error("找不到 write/notify 特征");
  await notifyCh.startNotifications();
  log("特征就绪");
}

/* 写包：BLE 默认 MTU 23 → 载荷 20 字节，21 字节开锁帧必须拆 20+1 */
function writeOne(buf) {
  const p = writeCh.properties || {};
  if (p.write) return writeCh.writeValue(buf);
  if (p.writeWithoutResponse) return writeCh.writeValueWithoutResponse(buf);
  return writeCh.writeValue(buf);
}

async function send(bytes) {
  for (let i = 0; i < bytes.length; i += CHUNK) {
    const part = bytes.slice(i, Math.min(i + CHUNK, bytes.length));
    await writeOne(part);
    if (i + CHUNK < bytes.length) await sleep(40);
  }
}

/* 收包：收到数据后静默 RX_QUIET 就算一帧收完 */
function collect(ms) {
  return new Promise(resolve => {
    const chunks = [];
    let timer = null;
    const finish = () => {
      clearTimeout(timer);
      notifyCh.removeEventListener("characteristicvaluechanged", handler);
      const total = chunks.reduce((n, c) => n + c.length, 0);
      const buf = new Uint8Array(total);
      let off = 0;
      for (const c of chunks) { buf.set(c, off); off += c.length; }
      resolve(bytesToHex(buf));
    };
    const handler = e => {
      chunks.push(new Uint8Array(e.target.value.buffer));
      clearTimeout(timer);
      timer = setTimeout(finish, RX_QUIET);
    };
    notifyCh.addEventListener("characteristicvaluechanged", handler);
    timer = setTimeout(finish, ms);
  });
}

async function runUnlock(dev) {
  device = dev;
  const key = getKey();
  if (!/^[0-9a-f]{32}$/.test(key)) throw new Error("activationKey 必须是 32 位 hex");

  log("连接 " + (dev.name || dev.id));
  const service = await openServer(dev);
  await bindChannels(service);

  // ① 随机数
  log("① 请求随机数");
  const p1 = collect(1500);
  await send(hexToBytes(RANDOM_REQ));
  const resp1 = await p1;
  log("   ← " + resp1);
  if (resp1.length < 46) throw new Error("随机数响应异常：" + resp1);
  const randomNumber = resp1.substr(14, 32);
  const sessionKey = xorHex(randomNumber, key);
  log("② sessionKey=" + sessionKey);

  // ③ 建链
  log("③ 建立加密链路");
  const p2 = collect(1500);
  await send(hexToBytes(LINK_ESTAB));
  const resp2 = await p2;
  log("   ← " + resp2);
  const ct2 = pickCipher(resp2);
  let ack = "";
  if (ct2) {
    try { ack = aesDec(sessionKey, ct2); } catch (e) {}
  }
  log("   ack=" + (ack || "(解不开)"));
  // 建链 ack 是唯一能证明「这台是我们的锁」的凭据：
  // 宿舍楼里几十把同型号锁广播名都一样，选错只能靠这一步发现。
  if (!ack.startsWith("ff13")) {
    throw new Error("这台不是你的门锁（ack 不匹配），再点一次换一台");
  }

  await sleep(180);   // 让建链 ack 的尾字节落完

  // ④ 开锁
  const body = "55AA0010" + aesEnc(sessionKey, UNLOCK_PLAIN);
  const frame = (body + checksum(body)).toUpperCase();
  for (let attempt = 1; attempt <= 3; attempt++) {
    log(`④ 开锁帧（第 ${attempt} 次）${frame}`);
    const p3 = collect(1800);
    await send(hexToBytes(frame));
    const resp3 = await p3;
    log("   ← " + (resp3 || "(无响应)"));
    const ct3 = pickCipher(resp3);
    if (ct3) {
      try {
        const pt = aesDec(sessionKey, ct3);
        log("   解密=" + pt);
        if (pt.startsWith("ff0b")) {
          log("✓ 开锁成功");
          return true;
        }
      } catch (e) {}
    }
    if (attempt < 3) await sleep(250);
  }
  return false;
}

function resetUi(keepStatus) {
  btn.disabled = false;
  if (keepStatus !== true) setStatus("准备", "");
}

async function finish(ok) {
  if (ok) {
    setStatus("已开锁", "ok");
    btn.classList.add("ok");
    btn.textContent = "已开";
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    setTimeout(() => { btn.classList.remove("ok"); btn.textContent = "开锁"; }, 2400);
  } else {
    setStatus("未确认成功", "err");
    btn.classList.add("err");
    setTimeout(() => btn.classList.remove("err"), 1400);
  }
  try { if (notifyCh) await notifyCh.stopNotifications(); } catch (e) {}
  try { if (device) device.gatt.disconnect(); } catch (e) {}
  writeCh = notifyCh = null;
  resetUi(true);          // 保留「已开锁」状态，别马上被「准备」覆盖
}

/* ---------------- 入口 ---------------- */

let lastDev = null;      // 已连接过 / 已记住的设备对象
let needPick = true;     // 下一次点击是否必须弹选择器

/* 点按钮：需要选设备时，第一跳同步调 requestDevice（手势内），之后才能 await */
btn.onclick = () => {
  if (btn.disabled) return;
  btn.disabled = true;

  if (!needPick && lastDev) {
    // 已授权的设备可以直接重连，不需要手势，也不会弹窗
    setStatus("开锁中…", "wait");
    doRun(lastDev);
    return;
  }

  setStatus("选择门锁…", "wait");
  const req = pickDeviceSync();     // ← 必须同步，不能放在 await 后面

  req.then(dev => {
    log("选中：" + (dev.name || "(无名)") + "  id=" + dev.id);
    lastDev = dev;
    needPick = false;
    localStorage.setItem("voc_dev_id", dev.id);
    doRun(dev);
  }).catch(err => {
    const m = String(err && (err.message || err));
    if (m.includes("cancel") || m.includes("NotFound") || m.includes("empty")) {
      log("取消选择");
    } else {
      log("× " + m);
      setStatus("打开失败", "err");
    }
    resetUi();
  });
};

async function doRun(dev) {
  try {
    setStatus("开锁中…", "wait");
    const ok = await runUnlock(dev);
    await finish(ok);
  } catch (e) {
    log("× " + (e.message || e));
    setStatus("失败", "err");
    try { if (device) device.gatt.disconnect(); } catch (_) {}
    needPick = true;          // 下次点击重新选设备
    lastDev = null;
    resetUi();
  }
}

/* 打开页面：如果浏览器记得这台设备，直接连（不需要手势），真正做到打开即开 */
(async () => {
  if (!navigator.bluetooth) {
    setStatus("这个浏览器不支持蓝牙", "err");
    log("iOS 请用 Bluefy 打开本页（Safari 不支持 Web Bluetooth）");
    return;
  }
  log("已就绪，点按钮开锁");

  const dev = await cachedDevice();
  if (!dev) return;
  log("发现上次记住的设备 " + (dev.name || dev.id) + "，自动开锁");
  lastDev = dev;
  needPick = false;
  btn.disabled = true;
  setStatus("自动开锁…", "wait");
  await doRun(dev);
})();
</script>
</body>
</html>
